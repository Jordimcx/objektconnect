services:
  postgres:
    image: postgres:16-alpine
    container_name: objektconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: objektconnect
      POSTGRES_PASSWORD: objektconnect
      POSTGRES_DB: objektconnect
    ports:
      - "5434:5432"
    volumes:
      - objektconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objektconnect -d objektconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  objektconnect-postgres:
